name: Feature Request
description: Suggest an improvement or new idea for ColdBru.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea for ColdBru.

        The most helpful requests are concrete, workflow-driven, and explain why the change matters.

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same request.
          required: true

  - type: dropdown
    attributes:
      label: What kind of request is this?
      options:
        - Workflow improvement
        - UI or UX improvement
        - Git or collaboration feature
        - API request authoring feature
        - Search or navigation feature
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: What do you want to see?
      description: Describe the idea clearly and explain how it would improve your ColdBru workflow.
      placeholder: |
        I want...
        This would help because...
    validations:
      required: true

  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Tell us what feels slow, awkward, or missing today.
      placeholder: |
        Right now...
        The pain point is...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Mockups, examples, or references
      description: Screenshots, sketches, links, or examples from other tools are welcome.
    validations:
      required: false
