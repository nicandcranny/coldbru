name: Bug Report
description: Report something broken in ColdBru.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ColdBru.

        ColdBru is an independent fork of Bruno, so details that make the issue reproducible are especially helpful.
        Before submitting, please check existing issues:
        [Search existing issues](https://github.com/nicandcranny/coldbru/issues?q=is%3Aissue)

  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find the same problem.
          required: true

  - type: input
    attributes:
      label: ColdBru version
      description: The version where you saw the problem.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    attributes:
      label: Operating System
      description: Your OS and version.
      placeholder: macOS 15.3 / Windows 11 / Ubuntu 24.04
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Severity
      description: How much is this affecting you?
      options:
        - Blocks me completely
        - Major slowdown
        - Annoying but workable
        - Minor issue
    validations:
      required: true

  - type: textarea
    attributes:
      label: What happened?
      description: Tell us what you expected, what actually happened, and how it affects your workflow.
      placeholder: |
        I expected...
        Instead, ColdBru...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: A short step-by-step list is perfect.
      placeholder: |
        1. Open...
        2. Click...
        3. See error...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction files or sample requests
      description: Paste a `.bru` file, config snippet, request payload, or anything else that helps reproduce the issue.
    validations:
      required: false

  - type: textarea
    attributes:
      label: Screenshots, logs, or screen recording
      description: Add screenshots, console output, error text, or a short recording if helpful.
    validations:
      required: false
